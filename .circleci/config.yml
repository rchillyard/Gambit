# Scala CircleCI 2.1 configuration file
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0

    working_directory: ~/DecisionTree

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "build.sbt" }}
            - v1-dependencies-

      - run:
          name: Compile
          command: sbt Test/compile

      - save_cache:
          paths:
            - ~/.sbt
            - ~/.ivy2/cache
            - ~/.cache/coursier
          key: v1-dependencies-{{ checksum "build.sbt" }}

      - run:
          name: Test
          command: sbt test